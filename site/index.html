<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d2943">
  <title>The Fresh Connection · 의사결정 시뮬레이터</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="logo"><span class="logo-mark">ṅ</span><strong>The <em>Fresh</em> Connection</strong></div>
      <div class="mast-actions"><span class="saved-state" id="saved-state" aria-live="polite">변경 내용은 이 브라우저에 저장됩니다</span><button class="help-button" id="source-help" type="button">출처 · 사용 안내</button></div>
    </header>
    <div class="body-shell">
      <aside class="side-rail" aria-label="주 메뉴">
        <button type="button" class="rail-link" data-area="company"><span class="rail-icon">▤</span><span>마이 컴퍼니</span></button>
        <button type="button" class="rail-link" data-area="finance"><span class="rail-icon">▥</span><span>재무보고서</span></button>
        <button type="button" class="rail-link" data-area="simulator"><span class="rail-icon">◇</span><span>시뮬레이터</span></button>
      </aside>
      <aside class="round-rail" aria-label="회차 선택">
        <div class="round-heading"><span class="round-symbol">◌</span><strong>회 차</strong></div>
        <div class="round-list" id="round-list"></div>
      </aside>
      <main class="workspace">
        <nav class="department-bar" id="department-bar" aria-label="부서 선택"></nav>
        <div class="workspace-inner">
          <div class="page-message" id="page-message" aria-live="polite"></div>
          <nav class="subtabs" id="subtabs" aria-label="업무 탭"></nav>
          <section id="view" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>
  <dialog class="edit-dialog" id="edit-dialog"><form method="dialog" id="edit-form"><div class="dialog-head"><div><small id="edit-kicker"></small><h2 id="edit-title"></h2></div><button type="button" class="close-button" id="close-edit" aria-label="닫기">×</button></div><div id="edit-fields" class="edit-fields"></div><div class="dialog-footer"><button type="button" class="plain-button" id="cancel-edit">취소</button><button type="submit" class="save-button">변경 저장</button></div></form></dialog>
  <dialog class="edit-dialog" id="calibration-dialog"><form method="dialog" id="calibration-form"><div class="dialog-head"><div><small>SIMULATION CALIBRATION</small><h2>모형 입력값</h2></div><button type="button" class="close-button" id="close-calibration" aria-label="닫기">×</button></div><p class="dialog-copy">관측값과 가정을 구분해 입력합니다. 필요한 값이 비어 있으면 예측 ROI는 표시하지 않습니다.</p><div id="calibration-fields" class="edit-fields"></div><div class="dialog-footer"><button type="button" class="plain-button" id="clear-calibration">입력값 지우기</button><button type="submit" class="save-button">저장하고 계산</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
